# Runs the tests, then builds the Mac app and publishes it as the
# "mac-latest" release, every time the main branch changes:
#   https://github.com/MarkJRogers92/ARPG/releases/download/mac-latest/Soulbound.zip
name: Mac build

on:
  push:
    branches: [claude/focused-fermat-m7jhtk]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-build
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.6"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot"
          rm godot.zip

      - name: Cache the macOS export template
        id: templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-macos-${{ env.GODOT_VERSION }}

      - name: Install the macOS export template
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz templates/macos.zip templates/version.txt
          dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dir"
          mv templates/macos.zip templates/version.txt "$dir/"
          rm -rf templates templates.tpz

      - name: Import assets
        run: timeout 600 "$RUNNER_TEMP/godot" --headless --path . --import

      - name: Run the tests
        run: timeout 900 "$RUNNER_TEMP/godot" --headless --path . -s tools/tests.gd 2>&1 | tail -25; exit ${PIPESTATUS[0]}

      - name: Export the Mac app
        run: |
          mkdir -p build
          timeout 600 "$RUNNER_TEMP/godot" --headless --path . --export-release "macOS" build/Soulbound.zip
          test -s build/Soulbound.zip
          ls -la build

      - name: Publish the mac-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mac-latest --yes --cleanup-tag || true
          gh release create mac-latest build/Soulbound.zip \
            --target "$GITHUB_SHA" \
            --title "Soulbound for Mac (latest)" \
            --notes "Built from ${GITHUB_SHA::7}. Install or update with this one line in Terminal:

          \`\`\`
          curl -fL -o /tmp/Soulbound.zip https://github.com/${GITHUB_REPOSITORY}/releases/download/mac-latest/Soulbound.zip && rm -rf /Applications/Soulbound.app && ditto -xk /tmp/Soulbound.zip /Applications && open /Applications/Soulbound.app
          \`\`\`

          (If you download the zip in a browser instead, macOS will warn that it can't check the app: right-click Soulbound.app and choose Open, or allow it in System Settings → Privacy & Security.)"
